[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalman-filter-toolkit"
version = "0.1.0"
description = "Kalman filter toolkit with diagnostics, noise modeling, and case studies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kotireddy Syamala" }]
keywords = ["kalman-filter", "state-estimation", "sensor-fusion", "navigation", "robotics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "ruff"]
jax = ["jax", "jaxlib"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["filters*", "noise*", "diagnostics*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Some systems (e.g. a sourced ROS 2 setup.bash) put ROS pytest plugins on
# PYTHONPATH, which leak into unrelated venvs via setuptools entry points and
# crash collection. Explicitly disable them so `pytest` works regardless of
# the caller's shell environment.
addopts = "-p no:launch_testing -p no:launch_ros"
